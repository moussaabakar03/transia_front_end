<div class="modal-overlay">
  <div class="modal-card">
    <div class="modal-header">
      <h2>Nouvel utilisateur</h2>
      <button class="btn-close" (click)="fermer.emit()">
        <span class="material-icons">close</span>
      </button>
    </div>

    <div class="modal-body">
      <!-- Informations de connexion -->
      <div class="form-section">
        <h3>Identifiants</h3>
        <div class="input-group">
          <label>Nom d'utilisateur *</label>
          <input type="text" [(ngModel)]="userData.username">
        </div>
        <div class="input-group">
          <label>Email *</label>
          <input type="email" [(ngModel)]="userData.email">
        </div>
        <div class="input-group">
          <label>Mot de passe *</label>
          <input type="password" [(ngModel)]="userData.password">
        </div>
        <div class="input-group">
          <label>Rôle</label>
          <select [(ngModel)]="userData.role">
            <option value="SUPER_ADMIN">Super Administrateur</option>
            <option value="ADMIN">Administrateur</option>
            <option value="MANAGER">Gestionnaire</option>
            <option value="ENQUETEUR">Enquêteur</option>
          </select>
        </div>
      </div>

      <!-- Profil -->
      <div class="form-section">
        <h3>Profil (optionnel)</h3>

        <div class="input-group">
          <label>Nom</label>
          <input type="text" [(ngModel)]="userData.first_name"/>
        </div>
        <div class="input-group">
          <label>Prenom</label>
          <input type="text" [(ngModel)]="userData.last_name"/>
        </div>
        <div class="input-group">
          <label>Adresse</label>
          <input type="text" [(ngModel)]="profilData.adresse">
        </div>
        <div class="input-group">
          <label>Téléphone</label>
          <input type="tel" [(ngModel)]="userData.phone">
        </div>
        <div class="input-group">
          <label>Date de naissance</label>
          <input type="date" [(ngModel)]="profilData.date_naissance">
        </div>
        <div class="input-group">
          <label>Photo de profil</label>
          <input type="file" accept="image/*" (change)="onFileSelected($event)">
          <div *ngIf="photoPreview" class="photo-preview">
            <img [src]="photoPreview" width="80">
          </div>
        </div>
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn-cancel" (click)="fermer.emit()">ANNULER</button>
      <button class="btn-submit" [disabled]="isLoading" (click)="submit()">
        {{ isLoading ? 'ENREGISTREMENT...' : 'CRÉER LE COMPTE' }}
      </button>
    </div>
  </div>
</div>
