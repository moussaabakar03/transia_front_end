<div class="modal-overlay">
  <div class="modal-card">
    <div class="modal-header">
      <h2>Nouvel utilisateur</h2>
      <button class="btn-close" (click)="fermer.emit()">
        <span class="material-icons">close</span>
      </button>
    </div>

    <div class="modal-body">
      <div class="form-section">
        <h3>Identifiants</h3>
        <div class="input-group">
          <label>Nom complet *</label>
          <input type="text" [(ngModel)]="userData.fullName" [disabled]="isLoading">
        </div>
        <div class="input-group">
          <label>Nom d'utilisateur *</label>
          <input type="text" [(ngModel)]="userData.username" [disabled]="isLoading">
        </div>
        <div class="input-group">
          <label>Mot de passe *</label>
          <input type="password" [(ngModel)]="userData.password" [disabled]="isLoading">
        </div>
        <div class="input-group">
          <label>Rôle</label>
          <select [(ngModel)]="selectedRoleId" [disabled]="isLoading || isLoadingRoles">
            <option *ngIf="isLoadingRoles" [ngValue]="null">Chargement...</option>
            <option *ngFor="let role of rolesList" [ngValue]="role.id">{{ role.name }}</option>
          </select>
        </div>
      </div>

      <div class="form-section">
        <h3>Profil (optionnel)</h3>
        <div class="input-group">
          <label>Téléphone</label>
          <input type="tel" [(ngModel)]="profilData.telephone" [disabled]="isLoading">
        </div>
        <div class="input-group">
          <label>Adresse</label>
          <input type="text" [(ngModel)]="profilData.adresse" [disabled]="isLoading">
        </div>
        <div class="input-group">
          <label>Photo de profil</label>
          <input type="file" accept="image/*" (change)="onFileSelected($event)" [disabled]="isLoading">
          <div *ngIf="photoPreview" class="photo-preview">
            <img [src]="photoPreview" width="80">
          </div>
        </div>
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn-cancel" (click)="fermer.emit()" [disabled]="isLoading">ANNULER</button>
      <button class="btn-submit" [disabled]="isLoading" (click)="submit()">
        {{ isLoading ? 'ENREGISTREMENT...' : 'CRÉER LE COMPTE' }}
      </button>
    </div>
  </div>
</div>
