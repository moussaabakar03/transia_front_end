<div class="modal-overlay" (click)="cancel()">
  <div class="modal-card modal-delete" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <span class="material-icons warning-icon">warning</span>
      <h2>Supprimer l'utilisateur</h2>
    </div>

    <div class="modal-body">
      <p class="delete-message">
        Êtes-vous sûr de vouloir supprimer <strong>{{ userName }}</strong> ?
      </p>
      <p class="delete-warning">
        Le compte sera désactivé définitivement et n'apparaîtra plus dans les listes actives.
        L'historique et les données déjà liées à cet utilisateur (colis, billets...) sont conservés.
      </p>
    </div>

    <div class="modal-footer">
      <button class="btn-cancel" [disabled]="isLoading" (click)="cancel()">ANNULER</button>
      <button class="btn-delete" [disabled]="isLoading" (click)="confirmDelete()">
        {{ isLoading ? 'SUPPRESSION...' : 'SUPPRIMER' }}
      </button>
    </div>
  </div>
</div>
